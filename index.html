<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https: http:; font-src 'self' file: data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>MSP++</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ====== MAIN LAYOUT ====== -->
    <div id="app-container">
      <!-- Site Webview Area -->
      <div id="webview-area">
        <!-- Tab Bar -->
        <div id="tab-bar">
          <div id="tab-list"></div>
          <button type="button" id="btn-new-tab" title="New tab">+</button>
          <button type="button" id="btn-downloads" class="nav-btn" title="Downloads">&#8659;</button>
          <button type="button" id="btn-notifications" class="nav-btn" title="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
          </button>
        </div>
        <!-- Address Bar: the active tab's URL; type a URL and press Enter to go there -->
        <div id="address-bar">
            <button type="button" id="btn-back" class="nav-btn" title="Go back (Alt+Left)" disabled>&#8249;</button>
            <button type="button" id="btn-forward" class="nav-btn" title="Go forward (Alt+Right)" disabled>&#8250;</button>
            <button type="button" id="btn-refresh" class="nav-btn" title="Refresh (F5)">&#8635;</button>
            <input type="text" id="address-input" placeholder="Type a URL and press Enter" title="Address (Ctrl+L)" aria-label="Address" autocomplete="off" spellcheck="false" />
            <button type="button" id="btn-zoom-reset" class="zoom-badge" title="Reset zoom (Ctrl+0)" hidden>100%</button>
        </div>
        <!-- Find Bar (shown on Ctrl+F) -->
        <div id="find-bar">
          <input type="text" id="find-input" placeholder="Find in page…" autocomplete="off" spellcheck="false" />
          <span id="find-match-count" class="find-match-count"></span>
          <button type="button" id="find-prev" class="find-btn" title="Previous match (Shift+Enter)">▲</button>
          <button type="button" id="find-next" class="find-btn" title="Next match (Enter)">▼</button>
          <button type="button" id="find-close" class="find-btn" title="Close (Esc)">✕</button>
        </div>
        <!-- Webview Container (webviews are added/removed dynamically) -->
        <div id="webview-container"></div>
      </div>

      <!-- Resize Handle -->
      <div id="resize-handle" title="Drag to resize"></div>

      <!-- Side Panel: a tabbed panel that plugins add tabs to (pluginAPI.ui.addSidePanelTab) -->
      <div id="side-panel">
        <!-- Panel Header: one tab per plugin view, plus the collapse button -->
        <div id="panel-header">
          <div id="side-panel-tabs" role="tablist" aria-label="Side panel"></div>
          <div id="panel-header-buttons">
            <button type="button" id="btn-toggle-panel" title="Collapse panel (Ctrl+Shift+B)">◀</button>
          </div>
        </div>

        <!-- Each plugin tab's view is added here -->
        <div id="side-panel-body"></div>
      </div>
    </div>

    <!-- Confirm Dialog (replaces native confirm() to avoid webview focus trap) -->
    <!-- Notifications Panel -->
    <div id="notifications-panel" class="downloads-panel">
      <div class="downloads-panel-header">
        <span class="downloads-panel-title">Notifications</span>
        <div class="downloads-panel-actions">
          <button type="button" id="btn-close-notifications" class="downloads-close">&times;</button>
        </div>
      </div>
      <div id="notifications-list" class="downloads-list">
        <div class="downloads-empty">No notifications</div>
      </div>
    </div>

    <!-- Downloads Panel -->
    <div id="downloads-panel" class="downloads-panel">
      <div class="downloads-panel-header">
        <span class="downloads-panel-title">Downloads</span>
        <div class="downloads-panel-actions">
          <button type="button" id="btn-clear-downloads" class="btn btn-small">Clear All</button>
          <button type="button" id="btn-close-downloads" class="downloads-close">&times;</button>
        </div>
      </div>
      <div id="downloads-list" class="downloads-list">
        <div class="downloads-empty">No downloads yet</div>
      </div>
    </div>

    <div id="confirm-overlay" class="confirm-overlay">
      <div class="confirm-dialog">
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-buttons">
          <button id="confirm-yes" class="btn btn-warning">Yes</button>
          <button id="confirm-no" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Tab Context Menu -->
    <div id="tab-context-menu" class="context-menu">
      <div class="context-menu-item" data-action="refresh">&#8635; Refresh Tab</div>
      <div class="context-menu-item" data-action="reopen-closed">&#8630; Reopen Closed Tab</div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" data-action="copy-url">
        📋 Copy URL
      </div>
      <div class="context-menu-item" data-action="copy-record-link">🔗 Copy Ticket Link</div>
      <div class="context-menu-item" data-action="open-browser">
        🌐 Open in Default Browser
      </div>
      <div class="context-menu-item" data-action="duplicate">
        📑 Duplicate Tab
      </div>
      <div class="context-menu-item" data-action="pin">📌 Pin Tab</div>
      <div class="context-menu-item" data-action="unpin">📌 Unpin Tab</div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" data-action="close">✕ Close Tab</div>
      <div class="context-menu-item" data-action="close-others">
        ✕ Close Other Tabs
      </div>
      <div class="context-menu-item" data-action="close-right">
        ✕ Close Tabs to the Right
      </div>
    </div>

    <!-- Collapsed Panel Toggle (shown when panel is hidden) -->
    <button
      id="btn-expand-panel"
      class="expand-btn"
      title="Open the side panel (Ctrl+Shift+B)"
    >
      ▶<br />P<br />A<br />N<br />E<br />L
    </button>

    <script src="address-bar.js"></script>
    <script src="page-zoom.js"></script>
    <script src="tab-shortcuts.js"></script>
    <script src="safe-html.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>

name: Build & Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v0.0.1, v1.0.0, etc.
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Actions are pinned to a commit so a moved tag cannot change what builds the
# release. To update one, replace the commit and the version in its comment.

# Nothing gets more than read access unless a job asks for it.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    # Building needs to read the code and nothing else. Only the release job
    # below may write to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # With the "publish" block in package.json, electron-builder also writes
      # latest.yml and the installer's .blockmap. The installed app reads latest.yml
      # from the release to find updates, so both must be attached to the release.
      - name: Build portable EXE and installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check update metadata
        shell: bash
        run: |
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          INSTALLER=$(sed -n 's/^path: //p' dist/latest.yml)
          echo "latest.yml points at: $INSTALLER"
          test -f "dist/$INSTALLER" || { echo "dist/$INSTALLER is missing"; exit 1; }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 90

  build-mac:
    runs-on: macos-latest

    # Building needs to read the code and nothing else. Only the release job
    # below may write to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-build
          path: dist/*.dmg
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-build
          path: artifacts/

      # The release is usually published on the GitHub page first, with notes
      # (such as the generated "What's Changed"). Keep those: put the build
      # block on top and the existing notes below it. The block sits between
      # markers so a re-run replaces it instead of adding a second copy.
      - name: Build release notes
        env:
          CURRENT: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${CURRENT}$" | head -1)
          START='<!-- msp-build-info:start -->'
          END='<!-- msp-build-info:end -->'

          # Existing notes, minus any build block an earlier run added.
          # Empty when the release doesn't exist yet (tag pushed directly).
          gh release view "$CURRENT" --repo "$GITHUB_REPOSITORY" --json body --jq .body > existing_body.md 2>/dev/null || : > existing_body.md
          awk -v s="$START" -v e="$END" '
            index($0, s) { skip = 1; next }
            skip && index($0, e) { skip = 0; next }
            !skip
          ' existing_body.md | tr -d '\r' | sed -e '/./,$!d' > existing_notes.md

          {
            echo "$START"
            echo "## MSP++ ${CURRENT}"
            echo ""
            echo "### Downloads"
            echo "- **Windows installer** — \`MSP-PlusPlus-Setup-${CURRENT#v}.exe\`, installs for just you (\`%LOCALAPPDATA%\\Programs\\MSP++\`, no admin) or everyone (\`C:\\Program Files\\MSP++\`); after that, MSP++ downloads and installs new versions itself"
            echo "- **Windows portable** — \`MSP++ ${CURRENT#v}.exe\`, no installation required (tells you about new versions but can't install them)"
            echo "- **macOS** — \`.dmg\` disk image, drag to Applications to install"
            # Generated notes already end with a Full Changelog link.
            if [ -n "$PREV" ] && ! grep -q "Full Changelog" existing_notes.md; then
              echo ""
              echo "**Full Changelog:** https://github.com/n3yne/MSP_PlusPlus/compare/${PREV}...${CURRENT}"
            fi
            echo ""
            echo "$END"
            if [ -s existing_notes.md ]; then
              echo ""
              cat existing_notes.md
            fi
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MSP++ ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          # A tag like v0.7.6-beta.1 stays a pre-release, so installed copies
          # (which only look at the latest full release) don't update to it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

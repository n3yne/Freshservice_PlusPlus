name: Build & Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v0.0.1, v1.0.0, etc.
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # With the "publish" block in package.json, electron-builder also writes
      # latest.yml and the installer's .blockmap. The installed app reads latest.yml
      # from the release to find updates, so both must be attached to the release.
      - name: Build portable EXE and installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check update metadata
        shell: bash
        run: |
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          INSTALLER=$(sed -n 's/^path: //p' dist/latest.yml)
          echo "latest.yml points at: $INSTALLER"
          test -f "dist/$INSTALLER" || { echo "dist/$INSTALLER is missing"; exit 1; }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 90

  build-mac:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/*.dmg
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: artifacts/

      - name: Build release notes
        env:
          CURRENT: ${{ github.ref_name }}
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${CURRENT}$" | head -1)

          {
            echo "## MSP++ ${CURRENT}"
            echo ""
            echo "### Downloads"
            echo "- **Windows installer** — \`MSP-PlusPlus-Setup-${CURRENT#v}.exe\`, installs for just you (\`%LOCALAPPDATA%\\Programs\\MSP++\`, no admin) or everyone (\`C:\\Program Files\\MSP++\`); after that, MSP++ downloads and installs new versions itself"
            echo "- **Windows portable** — \`MSP++ ${CURRENT#v}.exe\`, no installation required (tells you about new versions but can't install them)"
            echo "- **macOS** — \`.dmg\` disk image, drag to Applications to install"
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full Changelog:** https://github.com/n3yne/MSP_PlusPlus/compare/${PREV}...${CURRENT}"
            fi
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MSP++ ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/*
